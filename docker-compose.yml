services:
  web:
    build: .
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=zertz
      - PGUSER=zertz
      # Production sets DB_PASSWORD in .env; the default is for local development only.
      - PGPASSWORD=${DB_PASSWORD:-zertz_secret_password}
      - PORT=5050
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - APP_URL=${APP_URL:-http://localhost:5050}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    # Loopback only: reachable from this host (and an SSH tunnel), never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=zertz
      - POSTGRES_USER=zertz
      - POSTGRES_PASSWORD=${DB_PASSWORD:-zertz_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zertz -d zertz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
